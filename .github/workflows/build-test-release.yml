name: Build, test and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore LLamaModelLoader.slnx
      - name: Build
        run: dotnet build LLamaModelLoader.slnx -c Release --no-restore -m:1 -nr:false -p:UseSharedCompilation=false
      - name: Unit and integration tests
        run: dotnet test tests/LLamaModelLoader.Tests -c Release --no-build --no-restore -m:1 -nr:false --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: PowerShell 5.1 compatibility
        shell: powershell
        run: ./tests/ScriptChecks/Test-AskLlama.ps1
      - name: PowerShell 7 compatibility
        run: ./tests/ScriptChecks/Test-AskLlama.ps1
      - name: Headless UI checks
        run: dotnet run --project tests/SmokeChecks -c Release --no-build --no-restore -- render artifacts/screenshots-ci
      - name: Scrollbar layout checks
        run: dotnet run --project tests/SmokeChecks -c Release --no-build --no-restore -- layout artifacts/screenshots-layout
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-results/*.trx
            artifacts/screenshots-ci/*.png
            artifacts/screenshots-layout/*.png
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish Windows release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish standalone Windows x64 app
        run: dotnet publish src/LLamaModelLoader.Desktop -c Release -r win-x64 --self-contained true -o artifacts/release/app -m:1 -nr:false -p:UseSharedCompilation=false
      - name: Package and checksum
        run: |
          $archiveName = "LLamaModelLoader-build-$env:GITHUB_RUN_NUMBER-win-x64.zip"
          $archivePath = Join-Path 'artifacts/release' $archiveName
          Compress-Archive -Path 'artifacts/release/app/*' -DestinationPath $archivePath
          $checksum = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $archiveName" | Set-Content -LiteralPath "$archivePath.sha256" -Encoding utf8NoBOM
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release view $tag --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; keeping its original assets."
            exit 0
          }
          $archivePath = "artifacts/release/LLamaModelLoader-$tag-win-x64.zip"
          gh release create $tag $archivePath "$archivePath.sha256" --target $env:GITHUB_SHA --title "Llama Model Loader $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
